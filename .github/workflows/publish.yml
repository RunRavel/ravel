name: Publish to npm

# Publish @runravel/ravel when a version tag is pushed:
#   npm version patch   (bumps package.json + commits + tags)   — or bump by hand
#   git push --follow-tags
# Auth is OIDC "trusted publishing" — no NPM_TOKEN secret. Configure the trusted
# publisher for this package on npmjs.com (see docs/internal or the PR notes).

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm >= 11.5; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      # Root `npm ci` runs the `prepare` script, which builds ui/dist.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Guard: the tag must match package.json, so a mis-tagged push can't
      # publish a mismatched version.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - run: npm publish --provenance --access public
